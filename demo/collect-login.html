<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>接口采集自测 · 登录</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(160deg,#eef1fb,#f7f8fc 60%,#eef7f4);color:#1f2430;font-size:14px;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{width:400px;background:#fff;border-radius:16px;padding:28px;box-shadow:0 18px 50px rgba(16,24,40,.12)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .logo{width:38px;height:38px;border-radius:10px;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .title{font-size:17px;font-weight:600}
  .sub{font-size:12px;color:#8a90a2;margin-top:2px}
  label{display:block;font-size:13px;color:#4b5563;margin:14px 0 6px}
  input{width:100%;padding:10px 12px;border:1px solid #d6d9e3;border-radius:9px;font:inherit;outline:none}
  input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  button{width:100%;margin-top:18px;padding:11px 16px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button:active{transform:translateY(1px)}
  .msg{margin-top:14px;padding:10px 12px;border-radius:9px;font-size:13px;display:none}
  .msg.ok{display:block;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
  .msg.err{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
  .foot{margin-top:16px;font-size:12px;color:#9aa0b0;line-height:1.7}
  code{background:#f2f4f9;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo">采</div>
    <div>
      <div class="title">接口采集自测 · 登录</div>
      <div class="sub">登录后把 token 写进 localStorage，再进列表页</div>
    </div>
  </div>

  <form id="f" autocomplete="off">
    <label>账号</label>
    <input id="username" value="admin" placeholder="admin">
    <label>密码</label>
    <input id="password" type="password" value="123456" placeholder="123456；填 wrong 可以试登录失败">
    <button type="submit" id="submit">登录</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="foot">
    这条链路专门用来验证：<code>含页面文档</code> 录制、Cookie 会话、
    以及抓取时 <code>Authorization</code> 是否被浏览器里的最新值覆盖。<br>
    密码填 <code>wrong</code> 会返回 401，用来试「登录失败」分支。
  </div>
</div>

<script>
(function () {
  var msg = document.getElementById('msg');
  function show(text, ok) {
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
    msg.textContent = text;
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    show('登录中…', true);
    fetch('/demo/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
    }).then(function (r) {
      if (!r.ok || (r.data && r.data.code !== 0)) {
        show('登录失败：' + ((r.data && r.data.message) || ('HTTP ' + r.status)), false);
        return;
      }
      // 和真实站点一样：token 放 localStorage（这里用 demo_token）
      try { localStorage.setItem('demo_token', r.data.data); } catch (err) { }
      show('登录成功，token 已写入 localStorage，正在跳转列表页…', true);
      setTimeout(function () { location.href = '/demo/collect-orders.html'; }, 400);
    }).catch(function (err) {
      show('请求失败：' + err, false);
    });
  });
})();
</script>
</body>
</html>
